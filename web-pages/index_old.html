    display:block; padding:1.1rem 1.5rem; border:1px solid var(--gold); color:#e8cf94;
    text-decoration:none; letter-spacing:.08em; font-family:'Cinzel',serif; font-size:.95rem;
    transition:.25s;
  }
  a:hover { background:var(--gold); color:var(--maroon) }
